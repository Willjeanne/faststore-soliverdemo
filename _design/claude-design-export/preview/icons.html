<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 12px; }
  .icon-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-wrap { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #ededed; }
  .icon-name { font-size: 8px; color: #bbb; text-align: center; letter-spacing: 0.05em; }
  .label-sm { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #bbb; margin-bottom: 14px; }
  .divider { width: 100%; height: 1px; background: #f0f0f0; margin: 16px 0; }
  .row { display: flex; gap: 16px; align-items: center; }
  .icon-sizes { display: flex; gap: 16px; align-items: center; }
</style>
</head>
<body>
  <div class="label-sm">Icon set — stroke 1.5px (Lucide-style)</div>
  <div class="grid">
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
      <div class="icon-name">menu</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg></div>
      <div class="icon-name">search</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
      <div class="icon-name">account</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg></div>
      <div class="icon-name">bag</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21C12 21 3 14.5 3 8.5A5 5 0 0112 5.9 5 5 0 0121 8.5C21 14.5 12 21 12 21z"/></svg></div>
      <div class="icon-name">wishlist</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg></div>
      <div class="icon-name">filter</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      <div class="icon-name">close</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="icon-name">chevron →</div>
    </div>
    <div class="icon-item">
      <div class="icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>
      <div class="icon-name">chevron ↓</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="label-sm">Tailles d'usage</div>
  <div class="icon-sizes">
    <div class="icon-item">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <div class="icon-name">12px</div>
    </div>
    <div class="icon-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <div class="icon-name">16px</div>
    </div>
    <div class="icon-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <div class="icon-name">20px (nav)</div>
    </div>
    <div class="icon-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <div class="icon-name">24px</div>
    </div>
  </div>
</body>
</html>
