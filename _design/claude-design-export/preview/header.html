<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f5f5; }
  .demo { margin-bottom: 8px; }
  .label-sm { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #bbb; padding: 12px 0 8px; text-align: center; }

  /* Header */
  header { background: #fff; border-bottom: 1px solid #e8e5e5; }
  .promo-bar { background: #98b1c8; color: #fff; text-align: center; padding: 9px 20px; font-size: 10px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; }
  .header-main { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; }
  .nav-left { display: flex; align-items: center; gap: 20px; }
  .nav-left button { background: none; border: none; cursor: pointer; padding: 4px; }
  .nav-link { font-size: 10px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: #161925; text-decoration: none; white-space: nowrap; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; font-weight: 300; color: #161925; letter-spacing: -0.02em; position: absolute; left: 50%; transform: translateX(-50%); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-right button { background: none; border: none; cursor: pointer; padding: 4px; position: relative; }
  .cart-count { position: absolute; top: 0; right: 0; width: 14px; height: 14px; background: #161925; color: #fff; font-size: 8px; font-weight: 500; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .header-main { position: relative; }
</style>
</head>
<body>
  <div class="label-sm">Header — desktop</div>
  <div class="demo">
    <header>
      <div class="promo-bar">Newsletter anmelden — 10% auf die erste Bestellung</div>
      <div class="header-main">
        <div class="nav-left">
          <button>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <a class="nav-link" href="#">New In</a>
          <a class="nav-link" href="#">Clothes</a>
          <a class="nav-link" href="#">Bags</a>
        </div>
        <div class="logo">lala berlin</div>
        <div class="nav-right">
          <button>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
          </button>
          <button>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </button>
          <button style="position:relative;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="14"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
            <span class="cart-count">2</span>
          </button>
        </div>
      </div>
    </header>
  </div>
</body>
</html>
