<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .variant { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; gap: 12px; }
  .logo-mark { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; letter-spacing: -0.02em; }
  .logo-sub { font-family: 'DM Sans', sans-serif; font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase; }
  .label-sm { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.4; }
</style>
</head>
<body>
  <div class="row">
    <!-- Dark on white -->
    <div class="variant" style="background:#fff;">
      <div style="text-align:center;">
        <div class="logo-mark" style="font-size:36px;color:#161925;line-height:1;">lala</div>
        <div class="logo-sub" style="font-size:8.5px;color:#161925;margin-top:4px;">BERLIN</div>
      </div>
      <div class="label-sm" style="color:#999;">Dark / White BG</div>
    </div>
    <!-- White on dark -->
    <div class="variant" style="background:#161925;">
      <div style="text-align:center;">
        <div class="logo-mark" style="font-size:36px;color:#fff;line-height:1;">lala</div>
        <div class="logo-sub" style="font-size:8.5px;color:#fff;margin-top:4px;">BERLIN</div>
      </div>
      <div class="label-sm" style="color:#ffffff55;">White / Dark BG</div>
    </div>
    <!-- Dark on warm -->
    <div class="variant" style="background:#e3cfcd;">
      <div style="text-align:center;">
        <div class="logo-mark" style="font-size:36px;color:#161925;line-height:1;">lala</div>
        <div class="logo-sub" style="font-size:8.5px;color:#161925;margin-top:4px;">BERLIN</div>
      </div>
      <div class="label-sm" style="color:#c38d8099;">Dark / Warm BG</div>
    </div>
  </div>
</body>
</html>
