<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; padding: 20px; }
  .row { display: flex; gap: 0; }
  .swatch { flex: 1; height: 72px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch-label { font-size: 10px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 1px; }
  .swatch-hex { font-size: 9px; opacity: 0.6; font-family: monospace; }
  .section-title { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
  .group { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="group">
  <div class="section-title">Neutrals — main scale</div>
  <div class="row">
    <div class="swatch" style="background:#ffffff; border: 1px solid #ededed;">
      <span class="swatch-label" style="color:#161925">White</span>
      <span class="swatch-hex" style="color:#161925">#ffffff</span>
    </div>
    <div class="swatch" style="background:#f5f5f5;">
      <span class="swatch-label" style="color:#161925">Off-white</span>
      <span class="swatch-hex" style="color:#161925">#f5f5f5</span>
    </div>
    <div class="swatch" style="background:#ededed;">
      <span class="swatch-label" style="color:#161925">Light gray</span>
      <span class="swatch-hex" style="color:#161925">#ededed</span>
    </div>
    <div class="swatch" style="background:#494949;">
      <span class="swatch-label" style="color:#fff">Dark gray</span>
      <span class="swatch-hex" style="color:#fff">#494949</span>
    </div>
    <div class="swatch" style="background:#161925;">
      <span class="swatch-label" style="color:#fff">Navy</span>
      <span class="swatch-hex" style="color:#fff">#161925</span>
    </div>
    <div class="swatch" style="background:#000000;">
      <span class="swatch-label" style="color:#fff">Black</span>
      <span class="swatch-hex" style="color:#fff">#000000</span>
    </div>
  </div>
</div>
</body>
</html>
