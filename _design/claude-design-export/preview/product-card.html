<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f5f5; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: #fff; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .img-wrap { position: relative; aspect-ratio: 3/4; background: #ededed; overflow: hidden; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; top: 10px; left: 10px;
    background: #161925; color: #fff; font-size: 8px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; padding: 3px 7px; }
  .badge-sale { background: #c38d80; }
  .wishlist { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.85); }
  .info { padding: 0 2px 10px; display: flex; flex-direction: column; gap: 3px; }
  .name { font-size: 10px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: #161925; line-height: 1.4; }
  .meta { font-size: 10px; color: #999; }
  .price { font-size: 11px; font-weight: 500; color: #161925; }
  .price-sale { color: #c38d80; }
  .price-orig { text-decoration: line-through; color: #bbb; font-size: 10px; margin-left: 4px; }

  /* Hover state demo */
  .card-hover .img-wrap { background: #e8e8e8; }
  .card-hover .img-wrap::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.03); }

  .state-label { font-size: 9px; color: #bbb; text-align: center; padding: 4px 0 8px; letter-spacing: 0.05em; }

  /* placeholder image using CSS gradient + text */
  .img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="grid">
    <!-- Default card -->
    <div>
      <div class="card">
        <div class="img-wrap">
          <div class="img-placeholder" style="background:linear-gradient(135deg,#e3cfcd,#f5f5f5);"></div>
          <div class="badge">New In</div>
          <div class="wishlist">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5"><path d="M12 21C12 21 3 14.5 3 8.5A5 5 0 0112 5.9 5 5 0 0121 8.5C21 14.5 12 21 12 21z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="name">T-Shirt Tegan Cotton</div>
          <div class="meta">white rose leopard</div>
          <div class="price">89,00 €</div>
        </div>
      </div>
      <div class="state-label">Default</div>
    </div>

    <!-- Hover state -->
    <div>
      <div class="card card-hover">
        <div class="img-wrap" style="background:linear-gradient(135deg,#dad1cb,#ede8e5);">
          <div class="img-placeholder" style="background:linear-gradient(135deg,#dad1cb,#ede8e5); transform:scale(1.03); transition:none;"></div>
          <div class="badge">New In</div>
          <div class="wishlist">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5"><path d="M12 21C12 21 3 14.5 3 8.5A5 5 0 0112 5.9 5 5 0 0121 8.5C21 14.5 12 21 12 21z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="name">Shirt Blazer Suri</div>
          <div class="meta">XS S M L XL</div>
          <div class="price">349,00 €</div>
        </div>
      </div>
      <div class="state-label">Hover (image zoom)</div>
    </div>

    <!-- Sale card -->
    <div>
      <div class="card">
        <div class="img-wrap" style="background:linear-gradient(135deg,#e3bcb0,#f5f5f5);">
          <div class="img-placeholder"></div>
          <div class="badge badge-sale">Sale</div>
          <div class="wishlist" style="background:rgba(255,255,255,0.85);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#161925" stroke="none"><path d="M12 21C12 21 3 14.5 3 8.5A5 5 0 0112 5.9 5 5 0 0121 8.5C21 14.5 12 21 12 21z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="name">Sweatshirt Berlin</div>
          <div class="meta">cotton faded beige</div>
          <div class="price"><span class="price-sale">119,00 €</span><span class="price-orig">179,00 €</span></div>
        </div>
      </div>
      <div class="state-label">Sale + Wishlist actif</div>
    </div>

    <!-- No badge -->
    <div>
      <div class="card">
        <div class="img-wrap" style="background:linear-gradient(135deg,#161925,#3f3d50);">
          <div class="img-placeholder"></div>
          <div class="wishlist">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161925" stroke-width="1.5"><path d="M12 21C12 21 3 14.5 3 8.5A5 5 0 0112 5.9 5 5 0 0121 8.5C21 14.5 12 21 12 21z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="name">Tank Top Heike</div>
          <div class="meta">cotton coral</div>
          <div class="price">49,00 €</div>
        </div>
      </div>
      <div class="state-label">Sans badge</div>
    </div>
  </div>
</body>
</html>
