<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f5f5; }
  .label-sm { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #bbb; padding: 10px 0 8px; text-align: center; }
  footer { background: #4e4e4e; color: #fff; padding: 40px 48px 24px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; margin-bottom: 32px; }
  .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; font-weight: 300; margin-bottom: 14px; letter-spacing: -0.01em; }
  .footer-tagline { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; letter-spacing: 0.04em; max-width: 200px; }
  .footer-col-title { font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
  .footer-links { display: flex; flex-direction: column; gap: 8px; }
  .footer-link { font-size: 11px; color: rgba(255,255,255,0.75); text-decoration: none; letter-spacing: 0.04em; }
  .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  .footer-legal { display: flex; gap: 20px; }
  .footer-legal a { font-size: 10px; color: rgba(255,255,255,0.4); text-decoration: none; letter-spacing: 0.06em; }
  .footer-social { display: flex; gap: 14px; }
  .footer-social a { color: rgba(255,255,255,0.6); }
  .newsletter-form { display: flex; margin-top: 16px; }
  .newsletter-input { flex: 1; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; letter-spacing: 0.04em; outline: none; }
  .newsletter-input::placeholder { color: rgba(255,255,255,0.4); }
  .newsletter-btn { padding: 10px 16px; background: #fff; color: #161925; border: none; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
  <div class="label-sm">Footer — desktop</div>
  <footer>
    <div class="footer-grid">
      <div>
        <div class="footer-logo">lala berlin</div>
        <div class="footer-tagline">Contemporary fashion from Berlin — since 2003.</div>
        <div class="newsletter-form">
          <input class="newsletter-input" type="email" placeholder="E-Mail Adresse">
          <button class="newsletter-btn">Anmelden</button>
        </div>
      </div>
      <div>
        <div class="footer-col-title">Shop</div>
        <div class="footer-links">
          <a class="footer-link" href="#">New In</a>
          <a class="footer-link" href="#">Clothes</a>
          <a class="footer-link" href="#">Bags</a>
          <a class="footer-link" href="#">Accessories</a>
          <a class="footer-link" href="#">Sale</a>
        </div>
      </div>
      <div>
        <div class="footer-col-title">Service</div>
        <div class="footer-links">
          <a class="footer-link" href="#">FAQ</a>
          <a class="footer-link" href="#">Versand</a>
          <a class="footer-link" href="#">Rücksendung</a>
          <a class="footer-link" href="#">Größentabelle</a>
          <a class="footer-link" href="#">Kontakt</a>
        </div>
      </div>
      <div>
        <div class="footer-col-title">Unternehmen</div>
        <div class="footer-links">
          <a class="footer-link" href="#">Über uns</a>
          <a class="footer-link" href="#">Responsibility</a>
          <a class="footer-link" href="#">Instagram</a>
          <a class="footer-link" href="#">Press</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="footer-legal">
        <a href="#">Impressum</a>
        <a href="#">Datenschutz</a>
        <a href="#">AGB</a>
        <a href="#">Cookie Policy</a>
      </div>
      <div class="footer-social">
        <a href="#">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
