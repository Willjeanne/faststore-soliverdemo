<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; padding: 20px; }
  .row { display: flex; gap: 0; }
  .swatch { flex: 1; height: 72px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch-label { font-size: 10px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 1px; }
  .swatch-hex { font-size: 9px; opacity: 0.7; font-family: monospace; }
  .section-title { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
  .group { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="group">
  <div class="section-title">Warm editorial — accent scale</div>
  <div class="row">
    <div class="swatch" style="background:#f7f0ee; border:1px solid #e8e5e5;">
      <span class="swatch-label" style="color:#161925">Blush 0</span>
      <span class="swatch-hex" style="color:#161925">#f7f0ee</span>
    </div>
    <div class="swatch" style="background:#e3cfcd;">
      <span class="swatch-label" style="color:#161925">Rose poudré</span>
      <span class="swatch-hex" style="color:#161925">#e3cfcd</span>
    </div>
    <div class="swatch" style="background:#e3bcb0;">
      <span class="swatch-label" style="color:#161925">Terracotta clair</span>
      <span class="swatch-hex" style="color:#161925">#e3bcb0</span>
    </div>
    <div class="swatch" style="background:#c38d80;">
      <span class="swatch-label" style="color:#fff">Terracotta rosé</span>
      <span class="swatch-hex" style="color:#fff">#c38d80</span>
    </div>
    <div class="swatch" style="background:#dad1cb;">
      <span class="swatch-label" style="color:#161925">Sable chaud</span>
      <span class="swatch-hex" style="color:#161925">#dad1cb</span>
    </div>
  </div>
</div>
<div class="group">
  <div class="section-title">Accents fonctionnels</div>
  <div class="row">
    <div class="swatch" style="background:#98b1c8;">
      <span class="swatch-label" style="color:#fff">Ardoise (promo)</span>
      <span class="swatch-hex" style="color:#fff">#98b1c8</span>
    </div>
    <div class="swatch" style="background:#4e4e4e;">
      <span class="swatch-label" style="color:#fff">Anthracite (footer)</span>
      <span class="swatch-hex" style="color:#fff">#4e4e4e</span>
    </div>
    <div class="swatch" style="background:#e8e5e5;">
      <span class="swatch-label" style="color:#494949">Border</span>
      <span class="swatch-hex" style="color:#494949">#e8e5e5</span>
    </div>
  </div>
</div>
</body>
</html>
